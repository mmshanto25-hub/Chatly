name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create google-services.json for Build
      run: |
        if [ ! -f app/google-services.json ]; then
          echo '{
            "project_info": {
              "project_number": "1234567890",
              "firebase_url": "https://chat-default-rtdb.firebaseio.com",
              "project_id": "chat-app",
              "storage_bucket": "chat-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "com.chatly.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForGitHubActionsBuildOnly123456"
                  }
                ],
                "services": {
                  "analytics_service": { "status": "1" },
                  "appinvite_service": { "status": "1" },
                  "fad_service": { "status": "1" },
                  "auth_service": { "status": "1" },
                  "cloud_firestore": {
                    "storage_bucket": "chat-app.appspot.com",
                    "database_url": "https://chat-app.firebaseio.com"
                  }
                }
              }
            ],
            "configuration_version": "1"
          }' > app/google-services.json
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: chatly-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
